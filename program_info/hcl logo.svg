<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer drop shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    
    <!-- 3D block inner shadow -->
    <filter id="block-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Black Outer Border -->
    <rect x="26" y="26" width="460" height="460" rx="100" fill="#000000" />
    
    <!-- Green Inner Frame -->
    <rect x="36" y="36" width="440" height="440" rx="90" fill="#65A56C" />
    
    <!-- Terracotta / Brown Center Background -->
    <rect x="64" y="64" width="384" height="384" rx="68" fill="#C4653B" />

    <!-- 3D Shift Knob Base (Dark Gray Bottom Shadow Layer) -->
    <rect x="138" y="240" width="236" height="160" rx="42" fill="#3D3D3D" />

    <!-- 3D Shift Knob Top Face (Medium Gray Surface Layer) -->
    <rect x="138" y="112" width="236" height="190" rx="42" fill="#7E7E7E" filter="url(#block-shadow)" />

    <!-- Gear Shift Pattern H-Shaped Lines -->
    <g stroke="#3A3A3A" stroke-width="7" stroke-linecap="round">
      <!-- Left Vertical Gate -->
      <line x1="200" y1="148" x2="200" y2="268" />
      <!-- Middle Vertical Gate -->
      <line x1="256" y1="148" x2="256" y2="268" />
      <!-- Right Vertical Gate -->
      <line x1="312" y1="148" x2="312" y2="268" />
      <!-- Horizontal Connecting Crossbar -->
      <line x1="200" y1="208" x2="312" y2="208" />
    </g>
  </g>
</svg>