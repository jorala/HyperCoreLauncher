<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="block-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Black Outer Border -->
    <rect x="2" y="2" width="44" height="44" rx="9" fill="#000000" />
    
    <!-- Green Inner Frame -->
    <rect x="3.5" y="3.5" width="41" height="41" rx="8" fill="#65A56C" />
    
    <!-- Terracotta Background -->
    <rect x="6" y="6" width="36" height="36" rx="6" fill="#C4653B" />

    <!-- 3D Shift Knob Base -->
    <rect x="13" y="22.5" width="22" height="15" rx="4" fill="#3D3D3D" />

    <!-- 3D Shift Knob Top Face -->
    <rect x="13" y="10.5" width="22" height="18" rx="4" fill="#7E7E7E" filter="url(#block-shadow)" />

    <!-- Gear Shift Pattern -->
    <g stroke="#3A3A3A" stroke-width="0.8" stroke-linecap="round">
      <line x1="18.5" y1="13.5" x2="18.5" y2="24.5" />
      <line x1="24" y1="13.5" x2="24" y2="24.5" />
      <line x1="29.5" y1="13.5" x2="29.5" y2="24.5" />
      <line x1="18.5" y1="19" x2="29.5" y2="19" />
    </g>
  </g>
</svg>