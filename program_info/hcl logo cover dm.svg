<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 20)" filter="url(#shadow)">
    <!-- Black Outer Border -->
    <rect x="0" y="0" width="200" height="200" rx="44" fill="#000000" />
    <!-- Green Frame -->
    <rect x="4" y="4" width="192" height="192" rx="40" fill="#65A56C" />
    <!-- Terracotta Background -->
    <rect x="16" y="16" width="168" height="168" rx="30" fill="#C4653B" />

    <!-- Gear Shift Block Base -->
    <rect x="48" y="92" width="104" height="70" rx="18" fill="#3D3D3D" />
    <!-- Gear Shift Block Top -->
    <rect x="48" y="36" width="104" height="84" rx="18" fill="#7E7E7E" />

    <!-- Gear Shift Pattern -->
    <g stroke="#3A3A3A" stroke-width="3.5" stroke-linecap="round">
      <line x1="75" y1="52" x2="75" y2="104" />
      <line x1="100" y1="52" x2="100" y2="104" />
      <line x1="125" y1="52" x2="125" y2="104" />
      <line x1="75" y1="78" x2="125" y2="78" />
    </g>
  </g>

  <!-- Text Section (White for Dark Mode) -->
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="bold">
    <text x="250" y="102" font-size="54" letter-spacing="-0.5">HyperCore</text>
    <text x="375" y="172" font-size="54" letter-spacing="-0.5">Launcher</text>
  </g>
</svg>